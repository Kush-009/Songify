<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Songify</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #F7EFEA;
            color: #38312C;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            height: fit-content;
        }
        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 25px;
            color: #52473F;
        }
        
        /* Auth Screen Styles */
        #auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            text-align: center;
        }
        #auth-screen p {
            color: #8A7F77;
            margin-bottom: 25px;
            font-size: 15px;
            line-height: 1.5;
        }
        .login-btn {
            background-color: #38312C;
            color: #F7EFEA;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s;
            width: 100%;
        }
        .login-btn:hover {
            opacity: 0.8;
        }

        /* Main UI Styles */
        #main-screen {
            display: none;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #52473F;
        }
        
        .playlist-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .playlist-card {
            display: flex;
            align-items: center;
            padding: 12px;
            background-color: #FCFAf8;
            border: 1px solid #F0E6DD;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .playlist-card:hover {
            background-color: #EFE4D9;
        }
        .playlist-card img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            margin-right: 15px;
            object-fit: cover;
            background-color: #EFE4D9;
        }
        .playlist-info {
            display: flex;
            flex-direction: column;
        }
        .playlist-title {
            font-weight: 600;
            font-size: 15px;
            color: #38312C;
        }
        .playlist-count {
            font-size: 13px;
            color: #8A7F77;
            margin-top: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 16px;
            border: 2px solid #F0E6DD;
            border-radius: 12px;
            font-size: 16px;
            background-color: #FCFAf8;
            outline: none;
            color: #38312C;
            transition: border-color 0.2s ease;
        }
        input[type="text"]:focus {
            border-color: #DBCAC0;
        }
        button {
            padding: 16px;
            background-color: #EFE4D9;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #52473F;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #E5D7C9;
        }
        button:active {
            background-color: #D9C8B7;
        }
        button:disabled {
            background-color: #F7EFEA;
            color: #A3968C;
            cursor: not-allowed;
        }
        .status-text {
            text-align: center;
            font-size: 14px;
            color: #8A7F77;
            margin-bottom: 20px;
            min-height: 20px;
            font-weight: 500;
        }
        .error-text {
            color: #D9534F;
        }
        .player-box {
            background-color: #F7EFEA;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .now-playing {
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            color: #52473F;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .control-btn {
            background-color: #FFFFFF;
            border: 1px solid #EFE4D9;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            padding: 0;
            color: #52473F;
            cursor: pointer;
        }
        .control-btn:hover {
            background-color: #FCFAf8;
        }
        .track-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            background-color: #FCFAf8;
            border: 1px solid #F0E6DD;
            border-radius: 12px;
        }
        .track-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-right: 10px;
            flex-grow: 1;
        }
        .track-title {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #38312C;
        }
        .track-artist {
            font-size: 13px;
            color: #8A7F77;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-status {
            font-size: 12px;
            font-weight: 600;
            color: #A3968C;
            margin-top: 6px;
        }
        .play-btn {
            background-color: #FFFFFF;
            border: 2px solid #EFE4D9;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }
        audio {
            display: none; 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Songify</h1>
    
    <!-- AUTH SCREEN -->
    <div id="auth-screen">
        <p>Connect your Spotify account to directly select and download your saved playlists.</p>
        <a href="/api/login" class="login-btn">Login with Spotify</a>
    </div>

    <!-- MAIN SCREEN -->
    <div id="main-screen">
        <div class="section-title">Select a Playlist</div>
        <div class="playlist-grid" id="user-playlists">
            <!-- Dynamically populated via JS -->
            <div style="text-align: center; font-size: 14px; color: #8A7F77;">Loading your playlists...</div>
        </div>

        <div class="section-title">Or Paste a Link</div>
        <div class="input-group">
            <input type="text" id="playlist-url" placeholder="Paste Spotify or YouTube link here...">
            <button id="extract-btn" onclick="processManualLink()">Extract & Download</button>
        </div>
        
        <div id="global-status" class="status-text">Your offline library is ready.</div>
        
        <div class="player-box">
            <div class="now-playing" id="now-playing-title">Not Playing</div>
            <div class="controls">
                <button class="control-btn" onclick="playPrev()">⏮</button>
                <button class="control-btn" onclick="togglePlayPause()" id="play-pause-btn">▶</button>
                <button class="control-btn" onclick="playNext()">⏭</button>
                <button class="control-btn" onclick="toggleShuffle()" id="shuffle-btn" style="font-size: 16px;">🔀</button>
            </div>
            <audio id="main-audio" playsinline></audio>
        </div>

        <ul class="track-list" id="track-list"></ul>
    </div>
</div>

<script>
    const dbName = 'SongifyOfflineDB_V4';
    let db;
    let playlistQueue = [];
    let currentTrackIndex = -1;
    let isShuffle = false;
    let spotifyToken = null;
    
    const audioEl = document.getElementById('main-audio');
    const statusEl = document.getElementById('global-status');
    const extractBtn = document.getElementById('extract-btn');
    const authScreen = document.getElementById('auth-screen');
    const mainScreen = document.getElementById('main-screen');

    // -- Authentication State Management --
    function checkAuth() {
        // Check URL for token after Vercel callback redirects here
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        const errorFromUrl = urlParams.get('error');

        if (tokenFromUrl) {
            localStorage.setItem('spotify_token', tokenFromUrl);
            window.history.replaceState({}, document.title, "/"); 
            spotifyToken = tokenFromUrl;
        } else {
            spotifyToken = localStorage.getItem('spotify_token');
        }

        if (errorFromUrl) {
            alert("Authentication failed. Please try again.");
            window.history.replaceState({}, document.title, "/"); 
        }

        if (spotifyToken) {
            authScreen.style.display = 'none';
            mainScreen.style.display = 'block';
            fetchUserPlaylists();
        } else {
            authScreen.style.display = 'flex';
            mainScreen.style.display = 'none';
        }
    }

    // -- Fetch and Display User's Playlists directly from Spotify --
    async function fetchUserPlaylists() {
        try {
            const res = await fetch('https://api.spotify.com/v1/me/playlists?limit=20', {
                headers: { 'Authorization': `Bearer ${spotifyToken}` }
            });
            
            if (res.status === 401) {
                // Token expired
                localStorage.removeItem('spotify_token');
                checkAuth();
                return;
            }

            const data = await res.json();
            const grid = document.getElementById('user-playlists');
            grid.innerHTML = '';

            if (data.items && data.items.length > 0) {
                data.items.forEach(playlist => {
                    const card = document.createElement('div');
                    card.className = 'playlist-card';
                    card.onclick = () => extractSpotifyAPI(playlist.id, playlist.name);
                    
                    const imgUrl = playlist.images.length > 0 ? playlist.images[0].url : '';
                    
                    card.innerHTML = `
                        <img src="${imgUrl}" alt="Cover">
                        <div class="playlist-info">
                            <div class="playlist-title">${playlist.name}</div>
                            <div class="playlist-count">${playlist.tracks.total} Tracks</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } else {
                grid.innerHTML = '<div style="text-align: center; color: #8A7F77; font-size: 14px;">No playlists found on your account.</div>';
            }
        } catch (error) {
            document.getElementById('user-playlists').innerHTML = '<div style="color: #D9534F; text-align: center; font-size: 14px;">Failed to load playlists.</div>';
        }
    }

    // -- Extract exact tracks from Spotify using the Access Token --
    async function extractSpotifyAPI(playlistId, playlistName) {
        statusEl.className = 'status-text';
        statusEl.innerText = `Extracting "${playlistName}"...`;
        extractBtn.disabled = true;

        try {
            const res = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks?limit=100`, {
                headers: { 'Authorization': `Bearer ${spotifyToken}` }
            });
            const data = await res.json();
            
            if (data.items) {
                const tracks = [];
                data.items.forEach((item, idx) => {
                    const track_info = item.track;
                    if (track_info) {
                        tracks.push({
                            id: `spot_${playlistId}_${idx}`,
                            title: track_info.name || 'Unknown Title',
                            artist: track_info.artists ? track_info.artists[0].name : 'Unknown Artist'
                        });
                    }
                });
                
                statusEl.innerText = `Found ${tracks.length} tracks. Starting downloads...`;
                playlistQueue = tracks;
                renderTrackList(playlistQueue, false);
                await downloadQueue(playlistQueue);
            }
        } catch (error) {
            statusEl.className = 'status-text error-text';
            statusEl.innerText = 'Failed to extract Spotify playlist data.';
        }
        extractBtn.disabled = false;
    }

    // -- Handle manual link pasting --
    async function processManualLink() {
        const urlInput = document.getElementById('playlist-url').value.trim();
        if (!urlInput) {
            alert('Please enter a link.');
            return;
        }

        // If they paste a Spotify link, use the fast API method directly!
        if (urlInput.includes('spotify.com/playlist/')) {
            const match = urlInput.match(/playlist\/([a-zA-Z0-9]+)/);
            if (match && match[1]) {
                extractSpotifyAPI(match[1], "Custom Link");
                return;
            }
        }

        // Fallback for YouTube or other links using backend Vercel Python script
        extractBtn.disabled = true;
        statusEl.className = 'status-text';
        statusEl.innerText = 'Extracting external link metadata...';
        
        try {
            const response = await fetch(`/api/playlist?url=${encodeURIComponent(urlInput)}&t=${Date.now()}`);
            const data = await response.json();
            
            if (data.error) {
                statusEl.className = 'status-text error-text';
                statusEl.innerText = `Error: ${data.error}`;
            } else if (data.tracks && data.tracks.length > 0) {
                statusEl.innerText = `Found ${data.tracks.length} tracks. Starting downloads...`;
                playlistQueue = data.tracks;
                renderTrackList(playlistQueue, false);
                await downloadQueue(playlistQueue);
            } else {
                statusEl.className = 'status-text error-text';
                statusEl.innerText = 'Could not find any tracks.';
            }
        } catch (error) {
            statusEl.className = 'status-text error-text';
            statusEl.innerText = 'Network connection failed during extraction.';
        }
        extractBtn.disabled = false;
    }

    // -- Database Helpers --
    const initDB = () => {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(dbName, 1);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains('tracks')) {
                    db.createObjectStore('tracks', { keyPath: 'id' });
                }
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                loadOfflineTracks();
                resolve();
            };
            request.onerror = (e) => reject(e);
        });
    };

    function saveTrackToDB(track, blob) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction('tracks', 'readwrite');
            const store = tx.objectStore('tracks');
            const request = store.put({ id: track.id, title: track.title, artist: track.artist, blob: blob });
            request.onsuccess = () => resolve();
            request.onerror = (e) => reject(e);
        });
    }

    function checkTrackInDB(id) {
        return new Promise((resolve) => {
            const tx = db.transaction('tracks', 'readonly');
            const req = tx.objectStore('tracks').get(id);
            req.onsuccess = () => resolve(req.result !== undefined);
            req.onerror = () => resolve(false);
        });
    }

    function getTrackBlob(id) {
        return new Promise((resolve) => {
            const tx = db.transaction('tracks', 'readonly');
            const req = tx.objectStore('tracks').get(id);
            req.onsuccess = () => resolve(req.result ? req.result.blob : null);
            req.onerror = () => resolve(null);
        });
    }

    function loadOfflineTracks() {
        const tx = db.transaction('tracks', 'readonly');
        const req = tx.objectStore('tracks').getAll();
        req.onsuccess = () => {
            if (req.result && req.result.length > 0) {
                playlistQueue = req.result;
                renderTrackList(playlistQueue, true);
                if(statusEl.innerText.includes("library is ready")) {
                    statusEl.innerText = `Loaded ${playlistQueue.length} offline tracks.`;
                }
            }
        };
    }

    async function downloadQueue(tracks) {
        let failCount = 0;

        for (let track of tracks) {
            const exists = await checkTrackInDB(track.id);
            const trackStatusEl = document.getElementById(`status-${track.id}`);
            
            if (!exists) {
                if (trackStatusEl) trackStatusEl.innerText = 'Downloading...';
                
                let downloaded = false;
                for(let attempts = 0; attempts < 2; attempts++) {
                    try {
                        const query = `${track.title} ${track.artist} audio`;
                        const res = await fetch(`/api/download?query=${encodeURIComponent(query)}&t=${Date.now()}`);
                        
                        if (res.ok) {
                            const blob = await res.blob();
                            await saveTrackToDB(track, blob);
                            if (trackStatusEl) trackStatusEl.innerText = 'Saved Offline';
                            downloaded = true;
                            break; 
                        }
                    } catch (e) {}
                }
                
                if (!downloaded) {
                    if (trackStatusEl) trackStatusEl.innerText = 'Failed';
                    failCount++;
                }
            } else {
                if (trackStatusEl) trackStatusEl.innerText = 'Already Offline';
            }
        }
        
        statusEl.className = 'status-text';
        if (failCount === 0) {
            statusEl.innerText = 'All music saved for offline play!';
        } else {
            statusEl.innerText = `Finished with ${failCount} errors. Select the playlist again to retry.`;
        }
        
        loadOfflineTracks();
    }

    function renderTrackList(tracks, isOfflineCheck) {
        const list = document.getElementById('track-list');
        list.innerHTML = '';
        tracks.forEach((track, index) => {
            const li = document.createElement('li');
            li.className = 'track-item';
            
            const infoDiv = document.createElement('div');
            infoDiv.className = 'track-info';
            infoDiv.innerHTML = `
                <div class="track-title">${track.title}</div>
                <div class="track-artist">${track.artist}</div>
                <div class="track-status" id="status-${track.id}">${isOfflineCheck ? 'Saved Offline' : 'Waiting...'}</div>
            `;
            
            const playBtn = document.createElement('button');
            playBtn.className = 'play-btn';
            playBtn.innerText = 'Play';
            playBtn.onclick = () => playTrack(index);
            
            li.appendChild(infoDiv);
            li.appendChild(playBtn);
            list.appendChild(li);
        });
    }

    // iOS Audio Unlocker
    let audioUnlocked = false;
    function unlockAudio() {
        if (!audioUnlocked) {
            audioEl.play().catch(() => {});
            audioEl.pause();
            audioEl.currentTime = 0;
            audioUnlocked = true;
            document.removeEventListener('click', unlockAudio);
            document.removeEventListener('touchstart', unlockAudio);
        }
    }
    document.addEventListener('click', unlockAudio);
    document.addEventListener('touchstart', unlockAudio);

    function playTrack(index) {
        if (index < 0 || index >= playlistQueue.length) return;
        currentTrackIndex = index;
        const track = playlistQueue[index];
        
        getTrackBlob(track.id).then(blob => {
            if (!blob) {
                alert('This track has not finished downloading yet.');
                return;
            }
            
            if (audioEl.src && audioEl.src.startsWith('blob:')) {
                URL.revokeObjectURL(audioEl.src);
            }

            const objectUrl = URL.createObjectURL(blob);
            audioEl.src = objectUrl;
            
            const playPromise = audioEl.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    document.getElementById('play-pause-btn').innerText = '⏸';
                }).catch(error => {
                    alert("Please tap anywhere on the screen first to allow audio playback.");
                });
            }
            
            document.getElementById('now-playing-title').innerText = `${track.title} - ${track.artist}`;
            
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.artist,
                    album: 'Songify Offline Library',
                });
                
                navigator.mediaSession.setActionHandler('play', () => { audioEl.play(); });
                navigator.mediaSession.setActionHandler('pause', () => { audioEl.pause(); });
                navigator.mediaSession.setActionHandler('previoustrack', playPrev);
                navigator.mediaSession.setActionHandler('nexttrack', playNext);
            }
        });
    }

    audioEl.addEventListener('play', () => { document.getElementById('play-pause-btn').innerText = '⏸'; });
    audioEl.addEventListener('pause', () => { document.getElementById('play-pause-btn').innerText = '▶'; });
    audioEl.addEventListener('ended', () => { playNext(); });

    function togglePlayPause() {
        if (audioEl.src) {
            if (audioEl.paused) {
                audioEl.play();
            } else {
                audioEl.pause();
            }
        }
    }

    function playNext() {
        if (playlistQueue.length === 0) return;
        let nextIndex = isShuffle ? Math.floor(Math.random() * playlistQueue.length) : currentTrackIndex + 1;
        if (nextIndex >= playlistQueue.length) nextIndex = 0;
        playTrack(nextIndex);
    }

    function playPrev() {
        if (playlistQueue.length === 0) return;
        let prevIndex = currentTrackIndex - 1;
        if (prevIndex < 0) prevIndex = playlistQueue.length - 1;
        playTrack(prevIndex);
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        const btn = document.getElementById('shuffle-btn');
        btn.style.backgroundColor = isShuffle ? '#D9C8B7' : '#FFFFFF';
    }

    // Start App
    initDB();
    checkAuth();
</script>
</body>
</html>
